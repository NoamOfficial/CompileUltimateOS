name: Assemble ASM Files (Web Compatible)

on:
  push:
    paths:
      - '**/*.asm'
      - 'includes/**'
  pull_request:
    paths:
      - '**/*.asm'
      - 'includes/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install NASM & xxd
        run: sudo apt-get update && sudo apt-get install -y nasm xxd

      - name: Create build folder
        run: mkdir -p build

      - name: Assemble all ASM files
        run: |
          BUILD_DIR=$(pwd)/build
          mkdir -p "$BUILD_DIR"

          echo "Assembling all top-level ASM files..."
          for f in $(find . -maxdepth 1 -name "*.asm"); do
            filename=$(basename "$f" .asm)
            echo "Assembling $f → $BUILD_DIR/$filename.bin"
            nasm -f bin -I includes "$f" -o "$BUILD_DIR/$filename.bin"
            xxd "$BUILD_DIR/$filename.bin" > "$BUILD_DIR/$filename.hex"
          done

      - name: Upload BIN + HEX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asm-output
          path: build/
          compression-level: 0
          if-no-files-found: ignore





