name: Assemble only new/changed ASM files

on:
  push:
    paths:
      - '**/*.asm'
      - 'includes/**'
  pull_request:
    paths:
      - '**/*.asm'
      - 'includes/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install NASM & xxd
      run: sudo apt-get update && sudo apt-get install -y nasm xxd

    - name: Create output folder
      run: mkdir -p build

    - name: Assemble only new/changed ASM files
      run: |
        # Get list of changed .asm files
        CHANGED=$(git diff --name-only HEAD^ HEAD | grep '\.asm$' || true)
        echo "Changed ASM files: $CHANGED"
        for f in $CHANGED; do
          filename=$(basename "$f" .asm)
          echo "Assembling $filename.asm"
          nasm -f bin -I includes "$f" -o "build/$filename.bin"
          xxd "build/$filename.bin" > "build/$filename.hex"
        done

    - name: Upload BIN + HEX artifacts
      uses: actions/upload-artifact@v4
      with:
        name: asm-output
        path: build/
        compression-level: 0
        if-no-files-found: error


