name: Assemble only new/changed ASM files

on:
  push:
    paths:
      - '**/*.asm'
      - 'includes/**'
  pull_request:
    paths:
      - '**/*.asm'
      - 'includes/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install NASM & xxd
      run: sudo apt-get update && sudo apt-get install -y nasm xxd

    - name: Create build folder
      run: mkdir -p build

    - name: Find changed ASM files
      id: find_changed
      run: |
        CHANGED=$(git diff --name-only HEAD^ HEAD | grep '\.asm$' || true)
        echo "changed=$CHANGED" >> $GITHUB_OUTPUT

    - name: Assemble new/changed ASM files
      run: |
        BUILD_DIR=$(pwd)/build
        mkdir -p "$BUILD_DIR"
        for f in ${{ steps.find_changed.outputs.changed }}; do
          [ -z "$f" ] && continue   # skip empty
          filename=$(basename "$f" .asm)
          rm -f "$BUILD_DIR/$filename.bin" "$BUILD_DIR/$filename.hex"
          echo "Assembling $f → $BUILD_DIR/$filename.bin"
          nasm -f bin -I includes "$f" -o "$BUILD_DIR/$filename.bin"
          xxd "$BUILD_DIR/$filename.bin" > "$BUILD_DIR/$filename.hex"

        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: asm-output
        path: build/
        compression-level: 0
        if-no-files-found: ignore



